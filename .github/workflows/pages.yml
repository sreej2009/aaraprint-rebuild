# Public preview on GitHub Pages: https://sreej2009.github.io/aaraprint-rebuild/
# Rebuilds on every push to main. Served under /aaraprint-rebuild/ and without the recovered
# media library (it lives outside this repository), so product photos show their placeholders.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build for the /aaraprint-rebuild/ sub-path
        run: npm run build
        env:
          PAGES_BASE: /aaraprint-rebuild/
          VITE_API_BASE_URL: /aaraprint-rebuild/api/v1
          VITE_MEDIA_BASE_URL: none
          VITE_SITE_URL: https://sreej2009.github.io/aaraprint-rebuild
      - name: Arrange the build for GitHub Pages
        run: node scripts/pages/prepare-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
